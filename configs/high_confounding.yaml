# PRISM - the stress test: what happens when unconfoundedness fails badly.
#
# Identical to configs/fast.yaml except that the unobserved confounder U is 7x stronger
# (0.35 instead of the calibrated 0.05). This is not a "harder" configuration, it is a
# BROKEN one, and it is committed deliberately so the failure is reproducible.
#
# Measured on 15,000 customers, horizon 6, comparing the estimated CATE against the
# simulator's known ground truth:
#
#   U strength   |ATE error|   rank corr. with the true effect
#   ----------   -----------   ---------------------------------
#        0.00          3.04     +0.37
#        0.05          2.29     +0.42    <- configs/default.yaml
#        0.10          3.32     +0.34
#        0.20          7.03     -0.36    <- ranking INVERTS here
#        0.35          8.29     -0.37    <- this file
#
# The true average effect is about +6.3. At U = 0.35 the bias is larger than the effect
# itself, so every estimator returns the wrong SIGN, and a policy built on it would
# systematically target the customers it should leave alone.
#
# Why ship this at all? Because the honest question about any causal analysis is not
# "is unconfoundedness true" (it never is) but "how far can it fail before my answer
# flips?". This config is that answer, and it is what the refutation suite and the
# E-value in prism/causal/refute.py are calibrated to detect. Run it with:
#
#   python -m prism.pipelines.run_all --config configs/high_confounding.yaml --steps all
#
# and compare artifacts/reports/leaderboard.csv against the default run.

seed: 7
experiment_name: prism-high-confounding

paths:
  artifacts: artifacts
  data: artifacts/data
  models: artifacts/models
  reports: artifacts/reports_high_confounding
  figures: docs/figures_high_confounding
  warehouse: artifacts/warehouse_hc.duckdb
  mlruns: artifacts/mlruns

sim:
  n_customers: 6000
  n_periods: 14
  horizon: 8
  origin: "2022-01-01"
  monthly_discount_rate: 0.01
  rct_fraction: 0.20
  confounding_strength: 1.0
  hidden_confounder_strength: 0.35   # <- the whole point of this file
  drift_strength: 0.6
  seasonality_amplitude: 0.25
  missing_rate: 0.08
  mnar_strength: 0.5
  outlier_rate: 0.004
  duplicate_rate: 0.002

split:
  train_end: 7
  valid_end: 10

model:
  survival_backend: auto
  survival_hidden: [32, 16]
  survival_epochs: 12
  survival_lr: 0.003
  clv_backend: auto
  clv_epochs: 12
  propensity_splits: 3
  propensity_clip: [0.01, 0.99]
  n_estimators: 120
  learning_rate: 0.08
  tune: false
  n_trials: 5

causal:
  learners: [t, dr, r, forest, survival]
  n_splits: 3
  forest_trees: 120
  forest_min_leaf: 15
  honest_fraction: 0.5
  doubly_robust: true
  outcome: value
  refute: true          # the refutation suite is the point here: does it catch the failure?
  refute_sims: 4

economics:
  arm_costs: [0.0, 12.0, 30.0, 55.0]
  offer_redemption_rate: [0.0, 0.62, 0.71, 0.48]
  margin_rate: 0.30
  discount_rate: 0.01
  horizon: 8
  fixed_campaign_cost: 0.0
  budget: 20000.0
  budget_grid: [0.0, 5000.0, 10000.0, 20000.0, 40000.0, 80000.0]

monitoring:
  psi_warn: 0.10
  psi_alert: 0.25
  ks_alert_p: 0.01
  cate_rank_corr_alert: 0.70
  sign_flip_alert: 0.15
