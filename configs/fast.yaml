# PRISM - fast configuration for CI, tests and a first local run (~2-4 minutes end to end).
# Same code path as configs/default.yaml, just smaller.

seed: 7
experiment_name: prism-causal-retention-fast

paths:
  artifacts: artifacts
  data: artifacts/data
  models: artifacts/models
  reports: artifacts/reports
  figures: docs/figures
  warehouse: artifacts/warehouse.duckdb
  mlruns: artifacts/mlruns

sim:
  n_customers: 6000
  n_periods: 14
  horizon: 8
  origin: "2022-01-01"
  monthly_discount_rate: 0.01
  rct_fraction: 0.20
  confounding_strength: 1.0
  hidden_confounder_strength: 0.05
  drift_strength: 0.6
  seasonality_amplitude: 0.25
  missing_rate: 0.08
  mnar_strength: 0.5
  outlier_rate: 0.004
  duplicate_rate: 0.002

split:
  train_end: 7
  valid_end: 10

model:
  survival_backend: auto
  survival_hidden: [32, 16]
  survival_epochs: 12
  survival_lr: 0.003
  clv_backend: auto
  clv_epochs: 12
  propensity_splits: 3
  propensity_clip: [0.01, 0.99]
  n_estimators: 120
  learning_rate: 0.08
  tune: false
  n_trials: 5

causal:
  # The X-learner is omitted here purely for speed: it fits two extra models per arm and
  # dominates the runtime of this config. configs/default.yaml runs the full set.
  learners: [t, dr, r, forest, survival]
  n_splits: 3
  forest_trees: 120
  forest_min_leaf: 15
  honest_fraction: 0.5
  doubly_robust: true
  outcome: value
  refute: true
  refute_sims: 4

economics:
  arm_costs: [0.0, 12.0, 30.0, 55.0]
  offer_redemption_rate: [0.0, 0.62, 0.71, 0.48]
  margin_rate: 0.30
  discount_rate: 0.01
  horizon: 8
  fixed_campaign_cost: 0.0
  budget: 20000.0
  budget_grid: [0.0, 5000.0, 10000.0, 20000.0, 40000.0, 80000.0]

monitoring:
  psi_warn: 0.10
  psi_alert: 0.25
  ks_alert_p: 0.01
  cate_rank_corr_alert: 0.70
  sign_flip_alert: 0.15
